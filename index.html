<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Crucial for iOS: Prevents zooming and makes it feel like a native app -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>For You ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* iOS standard font stack */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Soft, romantic gradient background */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            overflow: hidden; /* Prevent scrolling when hearts float */
            touch-action: manipulation; /* Faster tap response on iOS */
        }

        /* Glassmorphism effect popular in iOS */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(255, 182, 193, 0.3);
        }

        /* Fade in animation for the text */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Floating heart animation */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.5); }
        }
        .floating-heart {
            position: absolute;
            bottom: 20px;
            color: #ff4d4d;
            font-size: 24px;
            pointer-events: none; /* Let taps pass through to buttons */
            animation: floatUp 3s ease-in forwards;
            z-index: 50;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative bg-gradient-to-br from-pink-50 to-red-50 text-gray-800">

    <!-- Container designed for a phone screen -->
    <div class="w-full max-w-sm px-6 flex flex-col items-center z-10">
        
        <!-- Header with hidden camera button -->
        <div class="relative w-full flex justify-center items-center mb-8">
            <h1 class="text-3xl font-semibold tracking-tight text-pink-500 text-center drop-shadow-sm">
                Hey Beautiful
            </h1>
            <!-- Add Photo Button (Shows up after first tap) -->
            <button id="add-photo-btn" class="absolute right-0 hidden text-pink-400 hover:text-pink-600 transition-colors p-2 focus:outline-none" aria-label="Add photo">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
            <input type="file" id="photo-upload" class="hidden" accept="image/*">
        </div>

        <!-- The Message Card -->
        <div class="glass-card w-full rounded-3xl p-8 mb-10 min-h-[200px] flex flex-col items-center justify-center text-center transition-all duration-300 relative overflow-hidden">
            
            <!-- Photo Container (Hidden by default) -->
            <div id="photo-container" class="hidden w-full mb-4 flex justify-center relative group">
                <img id="message-photo" class="max-h-48 w-auto rounded-xl shadow-sm object-cover border-2 border-white/50" src="" alt="Memory">
                <!-- Delete photo button -->
                <button id="remove-photo-btn" class="absolute -top-2 -right-2 bg-white text-red-500 rounded-full p-1.5 shadow-md transition-opacity">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>

            <p id="message-text" class="text-lg leading-relaxed font-medium text-gray-700 w-full">
                Tap the button below whenever you need a reminder of how much I love you. ❤️
            </p>
        </div>

        <!-- The Interactive Button -->
        <button id="love-btn" class="w-full bg-gradient-to-r from-pink-400 to-red-400 hover:from-pink-500 hover:to-red-500 active:scale-95 text-white font-semibold py-4 px-8 rounded-full shadow-lg hover:shadow-xl transition-all duration-200 focus:outline-none flex items-center justify-center space-x-2">
            <span>Tell me why</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
            </svg>
        </button>

    </div>

    <!-- Hidden audio element (Optional, currently unused to keep it simple, but setup for future) -->
    <!-- <audio id="pop-sound" src="pop.mp3"></audio> -->

    <script>
        // You can edit these to make them personal to you both!
        // To hardcode images so they work when sharing a link, add an image URL to the "image" property.
        const messages = [
            { text: "I love the way your eyes light up when you smile.", image: null },
            { text: "You are the best part of my every single day.", image: null },
            { text: "I love how safe and happy I feel when I'm with you.", image: null },
            { text: "Your laugh is my absolute favorite sound in the world.", image: null },
            { text: "I love how we can talk about nothing for hours.", image: null },
            { text: "You make me want to be a better person every day.", image: null },
            { text: "I love the way you look at me.", image: null },
            { text: "Even just thinking about you makes me smile.", image: null },
            { text: "You are my favorite adventure.", image: null },
            { text: "I love all the little things you do that you don't even notice.", image: null },
            { text: "You are the most beautiful person, inside and out.", image: null },
            { text: "I love our inside jokes and the way we understand each other.", image: null },
            { text: "You make the ordinary moments feel extraordinary.", image: null },
            { text: "I fall in love with you a little more every day.", image: null },
            { text: "You're not just my girlfriend, you're my best friend.", image: null }
        ];

        const messageText = document.getElementById('message-text');
        const loveBtn = document.getElementById('love-btn');
        const addPhotoBtn = document.getElementById('add-photo-btn');
        const photoUpload = document.getElementById('photo-upload');
        const photoContainer = document.getElementById('photo-container');
        const messagePhoto = document.getElementById('message-photo');
        const removePhotoBtn = document.getElementById('remove-photo-btn');
        
        let currentIndex = -1;

        // Function to create a floating heart at the button's location
        function createHeart(e) {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            
            // Randomize the horizontal position slightly
            const randomX = (Math.random() - 0.5) * 100;
            heart.style.left = `calc(50% + ${randomX}px)`;
            
            document.body.appendChild(heart);

            // Remove the heart from the DOM after animation finishes
            setTimeout(() => {
                heart.remove();
            }, 3000);
        }

        // Function to update the card content
        function updateDisplay(index) {
            // Update text
            messageText.innerText = messages[index].text;
            
            // Check for locally uploaded image first, then fallback to hardcoded image
            const localImage = localStorage.getItem('love_note_img_' + index);
            const displayImage = localImage || messages[index].image;

            if (displayImage) {
                messagePhoto.src = displayImage;
                photoContainer.classList.remove('hidden');
            } else {
                photoContainer.classList.add('hidden');
                messagePhoto.src = '';
            }

            // Re-trigger animation
            messageText.classList.add('animate-fade-in');
            if(displayImage) photoContainer.classList.add('animate-fade-in');
        }

        // Handle Camera Button Click
        addPhotoBtn.addEventListener('click', () => {
            if (currentIndex >= 0) photoUpload.click();
        });

        // Handle File Upload and Compression
        photoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Compress image using Canvas to safely fit in localStorage
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert to base64 and save
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    localStorage.setItem('love_note_img_' + currentIndex, dataUrl);
                    
                    // Update UI
                    updateDisplay(currentIndex);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // Handle removing a photo
        removePhotoBtn.addEventListener('click', () => {
            localStorage.removeItem('love_note_img_' + currentIndex);
            updateDisplay(currentIndex);
        });

        // Main button click handler
        loveBtn.addEventListener('click', (e) => {
            // 1. Spawn a few floating hearts
            for(let i=0; i<3; i++) {
                setTimeout(() => createHeart(e), i * 150);
            }

            // 2. Remove the animation class to reset it
            messageText.classList.remove('animate-fade-in');
            photoContainer.classList.remove('animate-fade-in');
            
            // Force a reflow to restart the animation
            void messageText.offsetWidth; 

            // 3. Pick a random message that wasn't the last one shown
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * messages.length);
            } while (newIndex === currentIndex && messages.length > 1);
            
            currentIndex = newIndex;

            // 4. Update display and show the camera button
            updateDisplay(currentIndex);
            addPhotoBtn.classList.remove('hidden');
            
            // Change button text after first tap
            if (loveBtn.querySelector('span').innerText === "Tell me why") {
                loveBtn.querySelector('span').innerText = "Give me another";
            }
        });
    </script>
</body>
</html>
